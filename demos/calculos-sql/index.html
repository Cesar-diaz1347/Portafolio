<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Simulador paso a paso de un script T-SQL de conteo y valor: variables, tablas temporales, resultado y vista previa del borrado. La lógica corre en tu navegador con datos ficticios."
    />
    <meta name="theme-color" content="#0b1220" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f7fb" />
    <title>Cálculos SQL · Demo</title>

    <!-- Tema antes del primer pintado (sin parpadeo): la misma clave y lógica que el portafolio. -->
    <script>
      (function () {
        var tema = null;
        try {
          var guardado = localStorage.getItem('cd-tema');
          if (guardado === 'light' || guardado === 'dark') tema = guardado;
        } catch (e) {}
        if (tema) {
          var color = tema === 'light' ? '#f4f7fb' : '#0b1220';
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', color);
        } else {
          tema =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', tema);
      })();
    </script>
  </head>
  <body>
    <noscript>
      <p>Esta demo necesita JavaScript para ejecutar el script en tu navegador.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/demos/calculos-sql/main.tsx"></script>
  </body>
</html>

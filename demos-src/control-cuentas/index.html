<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control de cuentas · Demo</title>
    <!-- Esquema de color antes del primer pintado (misma clave que el colorSchemeManager). -->
    <script>
      (function () {
        try {
          var guardado = localStorage.getItem('controlPagos.colorScheme');
          var esquema =
            guardado === 'light' || guardado === 'dark'
              ? guardado
              : guardado === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-mantine-color-scheme', esquema);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

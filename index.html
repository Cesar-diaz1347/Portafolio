    <!-- Tema antes del primer pintado (sin parpadeo). Misma clave que Portafolio1.2: cd-tema. -->
    <script>
      (function () {
        var tema = null;
        try {
          var guardado = localStorage.getItem('cd-tema');
          if (guardado === 'light' || guardado === 'dark') tema = guardado;
        } catch (e) {}
        if (tema) {
          var color = tema === 'light' ? '#f4f7fb' : '#0b1220';
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', color);
        } else {
          tema =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', tema);
      })();
    </script>
